name: Redeploy Pages from an existing build

# Repackages the `github-pages` artifact from a previous successful run,
# correcting the stale `/LeanOA/` base path, and redeploys it.
# This avoids a full Lean rebuild when only the Jekyll link prefix is wrong.

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "Run ID whose github-pages artifact should be redeployed"
        required: true

permissions:
  contents: read
  actions: read          # required to read an artifact from another run
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: artifact

      - name: Unpack
        run: |
          mkdir -p site
          tar -xf artifact/artifact.tar -C site

      - name: Correct the stale base path
        run: |
          set -euo pipefail

          # 1) Absolute old-site URLs. These come from \home and \dochome in
          #    blueprint/src/web.tex and appear throughout blueprint/. Safe to
          #    rewrite recursively: the full origin+path prefix cannot collide
          #    with doc-gen4 module paths such as docs/LeanOA/CStarAlgebra/...
          # `|| true` guards pipefail: grep exits 1 when there is nothing to find.
          abs_before=$( { grep -rl 'https://jonbannon\.github\.io/LeanOA/' site --include='*.html' || true; } | wc -l )
          if [ "$abs_before" -gt 0 ]; then
            grep -rlZ 'https://jonbannon\.github\.io/LeanOA/' site --include='*.html' \
              | xargs -0 sed -i 's|https://jonbannon\.github\.io/LeanOA/|https://jonbannon.github.io/LeanOA-AI/|g'
          fi
          echo "absolute-URL rewrite: $abs_before file(s)"

          # 2) Root-relative /LeanOA/ links, emitted by Jekyll's baseurl. These
          #    exist ONLY in the site-root pages. Do NOT recurse here: docs/
          #    contains legitimate LeanOA/ module paths that must not change.
          rel=0
          for f in site/*.html; do
            [ -e "$f" ] || continue
            if grep -q '="/LeanOA/' "$f"; then
              sed -i 's|="/LeanOA/|="/LeanOA-AI/|g' "$f"
              echo "  patched root page $f"
              rel=$((rel+1))
            fi
          done
          echo "root-relative rewrite: $rel file(s)"

          if [ "$abs_before" -eq 0 ] && [ "$rel" -eq 0 ]; then
            echo "::error::Nothing was patched - wrong run-id?"; exit 1
          fi

          # Verify nothing stale survives, and that module paths are intact.
          if grep -rl 'jonbannon\.github\.io/LeanOA/' site --include='*.html'; then
            echo "::error::stale absolute references remain"; exit 1
          fi
          if grep -rl '="/LeanOA/' site --include='*.html'; then
            echo "::error::stale root-relative references remain"; exit 1
          fi
          test -f site/docs/LeanOA/CStarAlgebra/Corner.html \
            || { echo "::error::doc-gen4 module paths were damaged"; exit 1; }
          echo "verification passed"

      - name: Upload corrected site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
