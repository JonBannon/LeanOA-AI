  classification: SOURCE_RESULT
  summary: >-
    Source-formalized Sakai Proposition 1.15.2 clause (2). On every
    zero-centered norm-closed ball of an ultraweakly closed concrete
    self-adjoint operator algebra, intrinsic strong, coefficient-series
    ultrastrong, and SOT are canonically homeomorphic, with arbitrary-filter
    convergence corollaries. The proof uses filter-general positive-square
    criteria and reuses clause (1) on the bounded square ball. The intrinsic
    strong carrier is defined for any ultraweakly closed subalgebra of a dual
    C-star-algebra, and no global topology equality is claimed.
  source_reference: Sakai Proposition 1.15.2(2), printed page 35 / PDF page 47
